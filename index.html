<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awase</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #050507;
        color: #F1F5F9;
        overflow: hidden;
      }
      @keyframes awaseBootPulse {
        0%, 100% { opacity: 0.7; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      .awase-boot {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: radial-gradient(circle at 50% 45%, rgba(167, 139, 250, 0.14), #050507 62%);
        font-family: system-ui, -apple-system, sans-serif;
      }
      .awase-boot svg {
        animation: awaseBootPulse 2s ease-in-out infinite;
      }
      .awase-boot span {
        font-size: 13px;
        letter-spacing: 0.28em;
        color: #CBD5E1;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="awase-boot">
        <svg width="56" height="56" viewBox="0 0 36 36" fill="none">
          <rect x="1.5" y="1.5" width="33" height="33" rx="9.5" fill="#101218" stroke="rgba(255,255,255,0.16)" stroke-width="1.2" />
          <path d="M18 7.5L9 27H13L18 15.8V7.5Z" fill="#F8FAFC" />
          <path d="M18 7.5L27 27H23L18 15.8V7.5Z" fill="#C4B5FD" />
          <rect x="13" y="20.6" width="10" height="2.4" rx="1.2" fill="#FFFFFF" />
          <circle cx="18" cy="17.2" r="2.1" fill="#A78BFA" />
        </svg>
        <span>AWASE</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
